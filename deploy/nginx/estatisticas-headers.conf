# Cabeçalhos dos relatórios GoAccess (/estatisticas/). O HTML gerado pelo
# GoAccess tem script e estilo embutidos, por isso 'unsafe-inline' aqui —
# a página é estática, protegida por senha e não carrega nada de fora.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Cache-Control "no-store" always;
add_header Strict-Transport-Security "max-age=31536000" always;
