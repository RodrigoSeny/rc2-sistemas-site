# rc2sistemas.cloud / www — site institucional da RC2 Sistemas
#
# Substitui /etc/nginx/sites-available/rc2site (inclui as linhas SSL que o
# certbot gerou para este domínio).
#
#   - "/" e /site/* (css, js, imagens) saem ESTÁTICOS deste repositório:
#     a página inicial não cai quando o SuperPet reinicia.
#   - /estatisticas/ — relatórios de visitas (GoAccess), com senha.
#   - Qualquer outro caminho continua indo para o SuperPet (porta 3001), como
#     antes: login, catálogo, consulta, API e redirecionamentos da calculadora.

server {
    server_name rc2sistemas.cloud www.rc2sistemas.cloud;

    root /var/www/rc2-sistemas-site/public;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 50M;

    # Página inicial (estática). Só ela entra na estatística de visitas.
    location = / {
        access_log /var/log/nginx-rc2/sistemas.access.log rc2c_anon;
        include /var/www/rc2-sistemas-site/deploy/nginx/rc2site-headers.conf;
        expires -1;
        try_files /index.html =404;
    }

    # Arquivos do site (prefixo próprio, não colide com caminhos do SuperPet).
    location ^~ /site/ {
        access_log off;
        include /var/www/rc2-sistemas-site/deploy/nginx/rc2site-headers.conf;
        expires 7d;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }

    # Relatórios de visitas — protegidos por senha, fora do Google.
    location ^~ /estatisticas/ {
        alias /var/www/estatisticas/;
        index index.html;
        access_log off;
        auth_basic "Estatisticas RC2";
        auth_basic_user_file /etc/nginx/.htpasswd-estatisticas;
        include /var/www/rc2-sistemas-site/deploy/nginx/estatisticas-headers.conf;
    }

    # Todo o resto: SuperPet, exatamente como era antes.
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rc2sistemas.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rc2sistemas.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.rc2sistemas.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = rc2sistemas.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name rc2sistemas.cloud www.rc2sistemas.cloud;
    return 404; # managed by Certbot
}
